[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swisscam"
version = "0.1.0"
description = "CAD-to-G-code CAM for Swiss-type screw machines"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "SwissCAM" }]
dependencies = [
  "pydantic>=2.6",
  "jinja2>=3.1",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
cad = [
  "cadquery>=2.4",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[project.scripts]
swisscam = "swisscam.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
